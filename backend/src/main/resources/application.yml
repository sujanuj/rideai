spring:
  application:
    name: rideai-backend

  # Values come from environment variables when set (Docker, CI),
  # otherwise fall back to the local docker-compose defaults.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/rideai}
    username: ${DB_USER:rideai}
    password: ${DB_PASSWORD:rideai}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: rideai-backend
      auto-offset-reset: earliest

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always   # fine locally; restrict before any public deploy

# ---- RideAI settings ----
rideai:
  jwt:
    # Dev-only default. Any real deployment MUST set JWT_SECRET (base64, 32+ bytes):
    #   openssl rand -base64 32
    secret: ${JWT_SECRET:sXqpPktAOzBe1o7vYN93l8VO254GSBGu2cBIqFF+6V8=}
    ttl: 24h
  routing:
    enabled: ${ROUTING_ENABLED:true}         # false = straight-line estimates, no internet needed
    osrm-url: ${OSRM_URL:https://router.project-osrm.org}
  fare:
    base-cents: 250
    per-km-cents: 120
    per-minute-cents: 30
    minimum-cents: 600
  matching:
    radius-km: 5            # how far to look for drivers
    offer-timeout: 15s      # how long a driver has to accept
    search-timeout: 90s     # give up and cancel after this long
    sweep-interval: 2s      # how often expired offers are re-offered
