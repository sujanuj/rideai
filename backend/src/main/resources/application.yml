spring:
  application:
    name: rideai-backend

  # Values come from environment variables when set (Docker, CI),
  # otherwise fall back to the local docker-compose defaults.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/rideai}
    username: ${DB_USER:rideai}
    password: ${DB_PASSWORD:rideai}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: rideai-backend
      auto-offset-reset: earliest

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always   # fine locally; restrict before any public deploy
